# PostgreSQL pour le développement. Les identifiants doivent correspondre à backend/.env
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: droneship
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: droneship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneship"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
